[project]
name = "prometheus-sre-observability"
version = "1.0.0"
description = "Instrumented checkout API, Prometheus recording/alerting rules, SLO burn-rate alert generator and Grafana dashboards."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shubham Khedkar" }]
requires-python = ">=3.11"
dependencies = ["prometheus-client>=0.26.0", "pyyaml>=6.0.3"]

[project.scripts]
checkout-api = "checkout_api.cli:main"
slokit = "slokit.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "yamllint>=1.35"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkout_api", "src/slokit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S310"]
