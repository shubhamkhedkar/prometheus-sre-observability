# Example Prometheus configuration for the local docker-compose stack.
# Hostnames are compose service names; adjust targets for your own environment.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    environment: local-demo

rule_files:
  - rules/recording.yml
  - rules/alerts.yml
  - rules/slo-checkout-api.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: checkout-api
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["checkout-api:8080"]
        labels:
          team: payments
          tier: backend
    metric_relabel_configs:
      # Drop the default process/platform collectors' GC series to keep cardinality low.
      - source_labels: [__name__]
        regex: python_gc_.*
        action: drop

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
