# Local observability stack: checkout-api + loadgen + Prometheus + Alertmanager + Grafana.
# Run it yourself with `docker compose up -d` (see README). Ports bind to 127.0.0.1 only.
name: prometheus-sre-observability

services:
  checkout-api:
    build: .
    image: checkout-api:local
    environment:
      CHECKOUT_ERROR_RATE: ${CHECKOUT_ERROR_RATE:-0.0}
      CHECKOUT_SLOW_RATE: ${CHECKOUT_SLOW_RATE:-0.0}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  loadgen:
    image: checkout-api:local
    depends_on: [checkout-api]
    command: ["checkout-api", "loadgen", "--target", "http://checkout-api:8080", "--duration", "86400", "--rate", "20"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.35.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
